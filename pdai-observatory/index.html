<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02080b">
<title>pDAI Research Observatory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020609;color:#dffcff;font-family:Inter,Arial,sans-serif;overscroll-behavior:none;touch-action:none}button,input{font:inherit}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#brand{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:9px 12px 9px 14px;border-left:2px solid #55e7da;background:linear-gradient(90deg,#031419e8,transparent);font-weight:1000;font-size:13px;letter-spacing:.17em}
#brand small{display:block;margin-top:4px;color:#86a9b0;font-size:7px;letter-spacing:.2em}
#crosshair{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#d8fff9;box-shadow:0 0 12px #55e7da}
#quest{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);max-width:min(600px,60vw);padding:7px 12px;border:1px solid #55e7da55;border-radius:8px;background:#020a0edb;color:#bdeee8;font-size:8px;font-weight:900;letter-spacing:.09em;text-align:center;text-transform:uppercase}
#prompt{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 13px;border:1px solid #55e7da77;border-radius:8px;background:#020b0fe8;color:#d9fffa;font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;opacity:0;transition:.15s;white-space:nowrap}
.topBtn{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));padding:8px 10px;border:1px solid #2d6870;border-radius:8px;background:#031016e8;color:#cceff0;font-weight:900;font-size:8px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;touch-action:manipulation}.topBtn:hover{border-color:#55e7da;color:#fff}
#returnBtn{right:max(10px,env(safe-area-inset-right))}#archiveBtn{right:max(137px,calc(env(safe-area-inset-right) + 137px))}#sourceBtn{right:max(230px,calc(env(safe-area-inset-right) + 230px))}#resetBtn{right:max(320px,calc(env(safe-area-inset-right) + 320px))}
#panel{position:fixed;z-index:25;right:12px;top:58px;width:min(520px,calc(100vw - 24px));height:min(720px,calc(100vh - 76px));display:flex;flex-direction:column;padding:13px;border:1px solid #28727a;border-radius:14px;background:linear-gradient(180deg,#04171df7,#02090df8);box-shadow:0 22px 75px #000d;transform:translateX(calc(100% + 30px));transition:.27s ease;pointer-events:auto;touch-action:pan-y}#panel.open{transform:translateX(0)}
#panelHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid #17383e;flex:none}#panelTitle{font-size:15px;font-weight:1000;letter-spacing:.08em;color:#cffff9}#panelMeta{margin-top:3px;font-size:7px;color:#70969d;line-height:1.4}#panelClose{border:1px solid #315a60;border-radius:7px;background:#071217;color:#b8d4d7;padding:6px 8px;cursor:pointer}#panelBody{flex:1;min-height:0;overflow:auto;padding-top:9px;padding-right:3px;touch-action:pan-y}
.badge{display:inline-block;padding:3px 6px;margin:0 4px 4px 0;border-radius:999px;border:1px solid;font-size:7px;font-weight:1000;letter-spacing:.08em}.badge.observed{border-color:#55e7da;color:#75fff0;background:#08302e77}.badge.interpretation{border-color:#b88cff;color:#d2afff;background:#24113977}.badge.requirement{border-color:#ffd76b;color:#ffe5a0;background:#37260977}
.card{margin:7px 0;padding:9px;border:1px solid #173a40;border-radius:9px;background:#041015}.card h3{margin:0 0 5px;color:#d5fff9;font-size:10px;letter-spacing:.06em}.card p{margin:4px 0;color:#9eb9be;font-size:9px;line-height:1.5;white-space:pre-wrap}.card .source{color:#607e84;font-size:7px}
.phaseRow{display:grid;grid-template-columns:28px 1fr;gap:7px;align-items:start;margin:5px 0;padding:7px;border:1px solid #164149;border-radius:8px;background:#031216}.phaseNo{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;border:1px solid #55e7da;color:#55e7da;font-size:9px;font-weight:1000}.phaseName{color:#d6fff9;font-size:8px;font-weight:1000;letter-spacing:.05em}.phaseText{color:#829fa5;font-size:8px;line-height:1.4;margin-top:3px}
#searchBox{display:flex;gap:5px;margin-bottom:8px}#searchInput{flex:1;min-width:0;padding:8px;border:1px solid #24545c;border-radius:7px;background:#01080b;color:#eafffc;outline:none;font-size:9px}#searchInput:focus{border-color:#55e7da}.smallBtn{padding:7px 8px;border:1px solid #2c6169;border-radius:7px;background:#06151a;color:#bfe8e8;font-size:8px;font-weight:900;cursor:pointer}#searchStatus{min-height:13px;margin:3px 0 5px;color:#6d9298;font-size:7px}
.docItem{width:100%;display:block;padding:8px;margin:0 0 5px;border:1px solid #14343a;border-radius:8px;background:#031015;color:#c6e3e5;text-align:left;cursor:pointer}.docItem:hover{border-color:#55e7da}.docItem b{display:block;color:#e0fffb;font-size:8px}.docItem span{display:block;margin-top:3px;color:#65868c;font-size:7px}#docText{white-space:pre-wrap;color:#aac5c9;font-size:9px;line-height:1.48}
.pool{padding:7px;margin:5px 0;border-left:2px solid #ff9b54;background:#1b0b0470}.pool b{color:#ffd0a8;font-size:8px}.pool div{color:#a9978a;font-size:7px;line-height:1.45;word-break:break-all}.notice{padding:8px;margin-bottom:8px;border:1px solid #ffd76b55;border-radius:8px;background:#2e210b55;color:#e9d69a;font-size:8px;line-height:1.45}
#loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#08262b,#010507 68%)}#loading div{text-align:center}#loading strong{display:block;color:#55e7da;font-size:44px;letter-spacing:.08em;text-shadow:0 0 28px #55e7da66}#loading span{display:block;margin-top:10px;color:#75999e;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
#mobile{display:none;position:fixed;inset:0;z-index:15;pointer-events:none}#stick{position:absolute;left:16px;bottom:16px;width:108px;height:108px;border-radius:50%;border:1px solid #55e7da44;background:#03191d66;pointer-events:auto;touch-action:none}#nub{position:absolute;width:44px;height:44px;left:32px;top:32px;border-radius:50%;border:1px solid #65e6da88;background:#23847b66}#mobileE{position:absolute;right:22px;bottom:28px;width:70px;height:70px;border-radius:50%;border:1px solid #ffd76baa;background:#2f230ddd;color:#ffe5a0;font-size:10px;font-weight:1000;pointer-events:auto;touch-action:manipulation}
@media(pointer:coarse),(max-width:820px){#mobile{display:block}#brand{font-size:9px}#quest{top:52px;max-width:56vw;font-size:6px}.topBtn{font-size:7px;padding:7px}#sourceBtn,#resetBtn{display:none}#archiveBtn{right:120px}#panel{top:48px;height:calc(100vh - 60px);width:min(470px,calc(100vw - 20px));right:10px}#prompt{bottom:128px;max-width:72vw;text-align:center;white-space:normal;font-size:8px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="hud"><div id="brand">pDAI RESEARCH OBSERVATORY<small>PULSECHAIN RESEARCH · 04 OCT 2026</small></div><div id="quest"></div><div id="crosshair"></div><div id="prompt"></div></div>
<button id="resetBtn" class="topBtn">Reset Guide</button><button id="sourceBtn" class="topBtn">Source PDF</button><button id="archiveBtn" class="topBtn">73 Appendices</button><button id="returnBtn" class="topBtn">Return to Atropa</button>
<aside id="panel"><div id="panelHead"><div><div id="panelTitle"></div><div id="panelMeta"></div></div><button id="panelClose">×</button></div><div id="panelBody"></div></aside>
<div id="mobile"><div id="stick"><div id="nub"></div></div><button id="mobileE">E / USE</button></div>
<div id="loading"><div><strong>pDAI</strong><span>Opening Research Observatory</span></div></div>
<script type="module" src="./observatory.js"></script>
</body></html>
