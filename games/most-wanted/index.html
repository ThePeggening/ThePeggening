<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b15"><title>Most Wanted — Atropa External Game</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b15;color:#f8d9e8;font-family:Arial,sans-serif}#mwext-status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:10px;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 35%,#2d1529,#090b15 65%);z-index:2}#mwext-status strong{font:900 28px/1 Impact,Arial,sans-serif;letter-spacing:.08em;color:#f3a5ca}#mwext-status span{font:11px/1.6 Arial;color:#d8bfd0;letter-spacing:.08em}#mwext-status.error strong{color:#ff8faf}#mwext-inner{position:fixed;inset:0;width:100%;height:100%;border:0;background:#090b15}#atropaMWReturn{display:none}</style></head><body><div id="mwext-status"><strong>MOST WANTED</strong><span id="mwext-note">Opening Crown City…</span></div><div id="atropaMWReturn" hidden></div>
<script>
(()=>{'use strict';
const note=document.getElementById('mwext-note'),status=document.getElementById('mwext-status');let inner=null,models=null;
const mode=new URLSearchParams(location.search).get('mode')==='website'?'website':'classic';
function fail(error){status.classList.add('error');status.querySelector('strong').textContent='MOST WANTED COULD NOT OPEN';note.textContent=String(error?.message||error);try{parent.postMessage({type:'ATROPA_ARCADE_ERROR',message:String(error?.message||error)},'*');}catch(_){} }
function inject(html,js){return html.replace(/<head([^>]*)>/i,'<head$1><script>'+js+'<\\/script>');}
function base64(bytes){const out=[];for(let i=0;i<bytes.length;i+=49152)out.push(btoa(String.fromCharCode.apply(null,bytes.subarray(i,i+49152))));return out.join('');}
function restore(bytes,spans){for(const [offset,count,stride,cs,m] of spans){const n=count*stride;if(offset<0||offset+n>bytes.length)throw new Error('Invalid packed model range');const source=bytes.slice(offset,offset+n),out=new Uint8Array(n);if(m===6||m===7){const size=m===6?256:4096;for(let row=0;row<count;row+=size){const rows=Math.min(size,count-row),base=row*stride;for(let col=0;col<stride;col++)for(let r=0;r<rows;r++)out[base+r*stride+col]=source[base+col*rows+r];}}else if(m===8){const words=n/cs;for(let col=0;col<cs;col++)for(let row=0;row<words;row++)out[row*cs+col]=source[col*words+row];}else{for(let col=0;col<stride;col++)for(let row=0;row<count;row++)out[row*stride+col]=source[col*count+row];}if(m===2){for(let i=stride;i<n;i++)out[i]=(out[i]+out[i-stride])&255;}else if(m===3){for(let i=stride;i<n;i++)out[i]^=out[i-stride];}else if(m===4||m===5){const values=cs===4?new Uint32Array(out.buffer):new Uint16Array(out.buffer),step=stride/cs;if(m===5)for(let i=0;i<values.length;i++)values[i]=(values[i]>>>1)^-(values[i]&1);for(let i=step;i<values.length;i++)values[i]+=values[i-step];}bytes.set(out,offset);}return bytes;}
function proxy(name){return (...args)=>inner?.contentWindow?.[name]?.(...args);}
Object.defineProperty(window,'neonCoast',{configurable:true,get(){try{return inner?.contentWindow?.neonCoast}catch(_){return undefined}}});
window.__mwFlushAllR48=proxy('__mwFlushAllR48');window.__mwSaveNow72=proxy('__mwSaveNow72');window.__atropaMWFlush66=proxy('__atropaMWFlush66');window.__mwOnHostLeaveR48=proxy('__mwOnHostLeaveR48');window.__atropaMWStorageWarning66=proxy('__atropaMWStorageWarning66');
window.__atropaMWHostFullscreenState66=active=>{try{inner?.contentWindow?.__atropaMWHostFullscreenState66?.(active)}catch(_){}};
async function prepareHost(){if(window.parent===window)throw new Error('Open Most Wanted through Atropa: The Peggening.');
 if(mode==='classic'){
  const upstream=parent.__atropaMWPortal66;if(!upstream)throw new Error('Atropa portal connection is unavailable. Return to Atropa and enter again.');
  window.__atropaMWPortal66={acquire(_s,key){return upstream.acquire(window,key)},fullscreen(_s,key,m){return upstream.fullscreen(window,key,m)},write(_s,key,name,value){return upstream.write(window,key,name,value)},complete(_s,key,id){return upstream.complete(window,key,id)},leave(_s,key){return upstream.leave(window,key)}};
 }else{
  if(!parent.__mostWantedSaveStore72||!parent.__atropaWebsiteArcade)throw new Error('Atropa website bridge is unavailable.');
  window.__mostWantedSaveStore72=parent.__mostWantedSaveStore72;const upstream=parent.__atropaWebsiteArcade;
  window.__atropaWebsiteArcade={fullscreen(_s,m){return upstream.fullscreen(window,m)},close(){return upstream.close()}};
 }
}
async function decodePackage(){note.textContent='Loading Crown City package…';const response=await fetch('./most-wanted-r68.pkg');if(!response.ok)throw new Error('Most Wanted package file is missing ('+response.status+'). Upload games/most-wanted/most-wanted-r68.pkg beside index.html.');if(typeof DecompressionStream==='undefined')throw new Error('A current browser with gzip support is required.');const compressed=new Uint8Array(await response.arrayBuffer());const envelope=new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());if(envelope.length<8)throw new Error('Incomplete Most Wanted package');const view=new DataView(envelope.buffer,envelope.byteOffset,envelope.byteLength),n=view.getUint32(4,true);if(view.getUint32(0,true)!==0x31574d50||n>1000000||8+n>envelope.length)throw new Error('Invalid Most Wanted package');const meta=JSON.parse(new TextDecoder().decode(envelope.subarray(8,8+n))),raw=envelope.subarray(8+n);if(meta.version!==1||meta.rawBytes!==raw.length||!Array.isArray(meta.entries))throw new Error('Most Wanted package size mismatch');let html=new TextDecoder().decode(raw.subarray(0,meta.htmlLength)),data=[];models={};for(const entry of meta.entries){if(!Number.isSafeInteger(entry.offset)||!Number.isSafeInteger(entry.length)||entry.offset<meta.htmlLength||entry.length<0||entry.offset+entry.length>raw.length)throw new Error('Invalid Most Wanted asset range');let bytes=raw.slice(entry.offset,entry.offset+entry.length);if(entry.transforms?.length)bytes=restore(bytes,entry.transforms);if(entry.kind==='model')models[entry.name]=bytes;else data[entry.id]=base64(bytes);}note.textContent='Preparing character models…';if(typeof parent.__atropaPrimePacked!=='function')throw new Error('Atropa shared model loader is unavailable.');models.richard=await parent.__atropaPrimePacked('richard-heart-glb');if(!models.ink||!models.richard)throw new Error('Most Wanted character models are incomplete');window.__atropaMostWantedModelsR48=()=>models;html=html.replace(/@@MWR41DATA(\d+)@@/g,(_,id)=>{if(typeof data[+id]!=='string')throw new Error('Missing Most Wanted asset '+id);return data[+id];});return html;}
function websitePatches(html){html=html.replace('‹ RETURN TO ATROPA','‹ RETURN TO WEBSITE');html=inject(html,`(()=>{const store=parent.__mostWantedSaveStore72,names=['neon-coast-adventure-save','neon-coast-living-settings','most-wanted-ui-layout-v1','most-wanted-before-import-r50','most-wanted-storage-transaction-r50'];if(!store)throw new Error('Shared game save store is unavailable');const api={getItem:key=>store.getItem(String(key)),setItem:(key,value)=>store.setItem(String(key),String(value)),removeItem:key=>store.removeItem(String(key)),clear:()=>names.forEach(key=>store.removeItem(key)),key:index=>names.filter(key=>store.getItem(key)!==null)[index]??null,get length(){return names.filter(key=>store.getItem(key)!==null).length;}};Object.defineProperty(window,'localStorage',{value:api,configurable:false});})();`);html=inject(html,`document.documentElement.classList.add('atropa-website-session');{const css=document.createElement('style');css.textContent='html.atropa-website-session #centerStatusHUD,html.atropa-website-session body>#raceHud,html.atropa-website-session #gunCounterUI .counterHeading,html.atropa-website-session body #missionGuideBtn.over-menu{top:calc(max(6px,env(safe-area-inset-top)) + 48px)!important}html.atropa-website-session body:has(#raceHud[style*="display: block"]) #toast{top:calc(max(6px,env(safe-area-inset-top)) + 118px)!important}html.atropa-website-session #uiEditor64 .ui64-toolbar{top:calc(max(6px,env(safe-area-inset-top)) + 48px);max-height:calc(100dvh - 74px)}';document.head.appendChild(css);}`);html=inject(html,`(()=>{const api=parent.__atropaWebsiteArcade;if(!api)return;const request=mode=>api.fullscreen(window,mode);const element=Element.prototype;for(const key of ['requestFullscreen','webkitRequestFullscreen']){try{Object.defineProperty(element,key,{configurable:true,writable:true,value:function(){return request('enter').then(()=>{});}});}catch(_){}}for(const key of ['exitFullscreen','webkitExitFullscreen']){try{Object.defineProperty(document,key,{configurable:true,value:function(){return request('exit').then(()=>{});}});}catch(_){}}window.__atropaMWHostFullscreenState66=active=>{document.documentElement.dataset.mwHostFullscreen=active?'1':'0';document.dispatchEvent(new CustomEvent('atropa-host-fullscreen',{detail:{active}}));};window.__atropaMWHostFullscreen66=async mode=>{const result=await request(mode);window.__atropaMWHostFullscreenState66(result.active);return result;};document.documentElement.dataset.mwFullscreenAck='1';})();`);html=inject(html,`window.addEventListener('error',e=>{if(e.message)parent.postMessage({type:'ATROPA_ARCADE_ERROR',message:e.message},'*');});window.addEventListener('unhandledrejection',e=>parent.postMessage({type:'ATROPA_ARCADE_ERROR',message:String(e.reason?.message||e.reason)},'*'));`);return html;}
async function start(){try{await prepareHost();let html=await decodePackage();if(mode==='website')html=websitePatches(html);note.textContent='Starting Crown City…';inner=document.createElement('iframe');inner.id='mwext-inner';inner.title='Most Wanted — Crown City';inner.allow='fullscreen; autoplay; gamepad';inner.setAttribute('allowfullscreen','');inner.name=mode==='classic'?window.name:'';inner.addEventListener('load',()=>{status.style.display='none';try{inner.contentWindow.focus()}catch(_){}});document.body.appendChild(inner);window.addEventListener('message',e=>{if(e.source===inner.contentWindow&&e.data&&typeof e.data==='object'){try{parent.postMessage(e.data,'*')}catch(_){}}});inner.srcdoc=html;html=null;}catch(error){fail(error)}}
start();
})();
</script></body></html>
